[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy"
version = "2.0.0"
description = "Self-hosted B2B lead discovery, contact enrichment, and compliant outreach by ISIRA Automations"
readme = "README.md"
authors = [
    { name = "ISIRA Automations", email = "automations@isira.org" }
]
keywords = [
    "lead-generation",
    "cold-email",
    "email-outreach",
    "sales-automation",
    "ai-agent",
    "autonomous-agent",
    "email-warmup",
    "google-maps-scraper",
    "b2b-leads",
    "prospecting",
    "gmail-api",
    "enrichment",
    "mcp",
    "mcp-server",
    "playwright",
    "growth-hacking",
    "isira-automations"
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "certifi>=2024.0.0",
    "mcp>=1.0.0",
    "dnspython>=2.6.0",
    "cryptography>=42.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40.0"]
gmail = [
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.120.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/isiraglobal/Reachy"
Repository = "https://github.com/isiraglobal/Reachy.git"
Issues = "https://github.com/isiraglobal/Reachy/issues"

[project.scripts]
reachy = "reachy.cli:main"
reachy-leads = "google_maps_leads.cli:main"
reachy-mcp = "google_maps_leads.mcp_server:main"
reachy-browser-test = "google_maps_leads.browser_test:main"
reachy-browser-install = "google_maps_leads.browser_installer:main"

[tool.setuptools.packages.find]
include = ["reachy*", "google_maps_leads*"]

[tool.setuptools.package-data]
reachy = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
