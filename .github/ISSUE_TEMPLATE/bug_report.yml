name: Bug Report
description: Create a report to help us improve Reachy
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues before submitting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: What commands or sequence triggered the issue?
      placeholder: |
        1. `reachy discover "wedding venues" ...`
        2. `reachy accounts add-gmail ...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, Python version, and Reachy version (`reachy --version`)
      placeholder: macOS 14.5, Python 3.12, Reachy 2.0.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Please paste sanitized logs (secrets and personal emails redacted).
      render: shell
