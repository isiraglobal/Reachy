name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[browser,gmail,dev]"

    - name: Verify compilation
      run: |
        python -m compileall -q reachy google_maps_leads leads email_outreach

    - name: Test CLI invocation & doctor
      run: |
        reachy --version
        reachy --help
        reachy-leads --help
        reachy init --home /tmp/reachy-test
        reachy doctor --home /tmp/reachy-test
        reachy --home /tmp/reachy-test2 init
        reachy --home /tmp/reachy-test2 doctor
